<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</head>

<body>

    <!-- tabelas em html:  -->
    <!-- TAGs table > thead (tr > th) > tbody (tr > td) -->

    <!-- Alinhamento horizontal pode ser feito com as classes text-start, text-end, text-center -->
    <!-- Alinhamento vertical é feito com align-middle, align-top, align-bottom -->

    <div class="container p-4">

        <table class="table table-striped">
    
            <thead class="text-center">
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Sobrenome</th>
                    <th scope="col">Turma</th>
                </tr>
            </thead>
            <tbody class="table-group-divider align-middle">
                <tr style="height: 100px;">
                    <th class="text-center">1</th>
                    <td>João</td>
                    <td>Silva</td>
                    <td class="text-center">352</td>
                </tr>
                <tr style="height: 100px;">
                    <th class="text-center">2</th>
                    <td>Luis</td>
                    <td>Nascimento</td>
                    <td class="text-center">151</td>
                </tr>
                <tr style="height: 100px;">
                    <th class="text-center">3</th>
                    <td>Alan</td>
                    <td>Lima</td>
                    <td class="text-center">341</td>
                </tr>
            </tbody>
        </table>

</body>
</div>

</html>

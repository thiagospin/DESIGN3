<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <!-- Tamanhos de input-group:
    input-group-sm: para inputs menores 
    input-group-lg: para inputs maiores
    input-group (sem tamanho especificado): tamanho padrão -->

    <form class="p-5">
      <fieldset class="mb-4">
        <legend>Tamanhos</legend>
        <div class="input-group input-group-sm mb-3">
          <span class="input-group-text" id="inputGroup-sizing-sm"
            >Pequeno</span
          >
          <input type="text" class="form-control" />
        </div>

        <div class="input-group mb-3">
          <span class="input-group-text" id="inputGroup-sizing-default"
            >Padrão</span
          >
          <input type="text" class="form-control" />
        </div>

        <div class="input-group input-group-lg">
          <span class="input-group-text" id="inputGroup-sizing-lg">Grande</span>
          <input type="text" class="form-control" />
        </div>

      </fieldset>
    </form>

  </body>
</html>

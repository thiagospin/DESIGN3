<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</head>

<body>
    <form class="p-5">
        <!-- Exemplo de select com uma opção desabilitada  -->
        <fieldset class="mb-4">
            <legend>Combo box</legend>
            <select class="form-select">
                <option selected>Select Menu</option>
                <option value="1">opção 1</option>
                <option value="2">opção 1</option>
                <option value="3" disabled>opção 1</option>
                <option value="4">opção 4</option>
            </select>
        </fieldset>

        <fieldset class="mb-4">
            <legend>Checkbox</legend>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" />
                <label class="form-check-label">
                    checkbox padrão
                </label>
            </div>
        </fieldset>

        <fieldset class="mb-4">
            <legend>Radio Buttons</legend>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" />
                <label class="form-check-label">
                    Opção 1
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" checked />
                <label class="form-check-label">
                    Opção 2 (selecionada por padrão)
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" />
                <label class="form-check-label">
                    Opção 3
                </label>
            </div>
        </fieldset>

        <fieldset class="mb-4">
            <legend>Text Area</legend>
            <div class="input-group mb-3">
                <span class="input-group-text">Área de Texto</span>
                <textarea class="form-control" placeholder="o scroll aparece automaticamente"></textarea>
            </div>
        </fieldset>

        <fieldset class="mb-4">
            <legend>Componentes lado a lado e label flutuante</legend>

            <div class="row g-2">
                <div class="col">
                    <div class="form-floating">
                        <input type="email" class="form-control" id="floatingInputGrid" placeholder="name@example.com"
                            value="mdo@example.com">
                        <label for="floatingInputGrid">Email address</label>
                    </div>
                </div>
                <div class="col">
                    <div class="form-floating">
                        <select class="form-select" id="floatingSelectGrid">
                            <option selected>Open this select menu</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select>
                        <label for="floatingSelectGrid">Works with selects</label>
                    </div>
                </div>
            </div>

        </fieldset>
    </form>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- A classe form-control é usada para estilizar elementos de formulário -->
    <!-- tornando-os mais bonitos, responsivos e consistentes com o design do Bootstrap -->
    <!-- Ela aplica padding, bordas arredondadas, largura total e outras propriedades visuais -->

    <form class="p-5">
        <fieldset>
            <legend>LOGIN NO SISTEMA</legend>

            <div class="mb-3">
                <label class="form-label">e-mail</label>
                <input type="email" class="form-control" id="emailInput"/>
                <div id="emailHelp" class="form-text">
                    Não iremos compartilhar seu e-mail com ninguém.
                </div>
            </div>

            <div class="mb-3">
                <label for="senhaInput" class="form-label">senha</label>
                <input type="password" class="form-control" id="senhaInput" />
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="checkbox" />
                <label class="form-check-label">permanecer logado?</label>
            </div>

            <button type="submit" class="btn btn-primary">Login</button>
        </fieldset>
    </form>
</body>

</html>
